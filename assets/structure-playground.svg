<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc">
  <title id="title">Interactive structure playground</title>
  <desc id="desc">A clickable card opening the NTF2–RanGDP complex in Molstar.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102C30"/><stop offset="1" stop-color="#071A1D"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4DD0C4"/><stop offset="1" stop-color="#168A91"/></linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#FFB466"/><stop offset="1" stop-color="#D96038"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="1396" height="326" rx="25" fill="url(#screen)" stroke="#26484B" stroke-width="4"/>
  <g opacity=".12" stroke="#BFE5DF" stroke-width="1">
    <path d="M0 82H1400M0 165H1400M0 248H1400"/><path d="M85 0V330M350 0V330M615 0V330M880 0V330M1145 0V330M1315 0V330"/>
  </g>
  <g transform="translate(90 35)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M58 130c-46-61 20-121 84-88 45 23 7 78 48 97 39 19 71-38 113-4 46 38-5 106-61 91-44-11-66 31-113 2-38-23-27-58-71-98Z" stroke="url(#a)" stroke-width="19"/>
    <path d="M252 58c41-46 107-12 103 44-4 45-46 45-47 81-1 42 55 48 43 94-14 54-91 48-117 6-23-37 12-61-11-95-26-38-75-12-87-54-12-43 46-69 116-76Z" stroke="url(#b)" stroke-width="18"/>
    <g stroke="#F7F4ED" stroke-width="3" opacity=".9"><path d="M211 94l34 15M206 132l48 7M211 170l39-3M216 205l31-10"/></g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="535" y="80" fill="#75B8B3" font-size="14" font-weight="700" letter-spacing="4">STRUCTURE PLAYGROUND · PDB 5BXQ</text>
    <text x="535" y="143" fill="#F7F4ED" font-size="38" font-weight="680">NTF2–RanGDP interface</text>
    <text x="535" y="188" fill="#AFC8C8" font-size="20">Rotate the complex · select residues · inspect the binding surface</text>
    <g transform="translate(535 226)">
      <rect width="280" height="52" rx="26" fill="#F7F4ED"/>
      <text x="140" y="33" text-anchor="middle" fill="#173B3F" font-size="17" font-weight="700">OPEN INTERACTIVE 3D  →</text>
    </g>
    <text x="1300" y="278" text-anchor="end" fill="#6E8F90" font-family="Consolas, monospace" font-size="14">powered by Mol*</text>
  </g>
</svg>
