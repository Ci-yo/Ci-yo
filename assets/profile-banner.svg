<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Xiyao Chen — Structure, evidence, insight</title>
  <desc id="desc">A protein surface flows through a computational trace into an RNA-like evidence helix.</desc>
